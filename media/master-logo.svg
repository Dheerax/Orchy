    <line x1="356.1" y1="789.2" x2="349.0" y2="800.2" />
    <line x1="311.9" y1="763.1" x2="302.6" y2="773.4" />
    <line x1="274.1" y1="730.8" x2="263.7" y2="740.1" />
    <line x1="243.8" y1="693.0" x2="233.0" y2="701.3" />
    <line x1="221.7" y1="650.6" x2="210.6" y2="657.9" />
    <line x1="208.6" y1="604.8" x2="197.3" y2="611.1" />
    <line x1="200.0" y1="512.0" x2="186.0" y2="512.0" stroke="#79c0ff" stroke-width="3" />
    <line x1="204.0" y1="457.8" x2="191.0" y2="455.4" />
    <line x1="215.7" y1="405.3" x2="204.1" y2="400.4" />
    <line x1="234.8" y1="356.1" x2="223.8" y2="349.0" />
    <line x1="260.9" y1="311.9" x2="250.6" y2="302.6" />
    <line x1="293.2" y1="274.1" x2="283.9" y2="263.7" />
