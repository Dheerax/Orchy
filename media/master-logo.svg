  <g stroke="rgba(255,255,255,0.25)" stroke-width="2">
    <line x1="824.0" y1="512.0" x2="838.0" y2="512.0" stroke="#79c0ff" stroke-width="3" />
    <line x1="820.0" y1="566.2" x2="833.0" y2="568.6" />
    <line x1="808.3" y1="618.7" x2="819.9" y2="623.6" />
    <line x1="789.2" y1="667.9" x2="800.2" y2="675.0" />
