    <circle cx="300" cy="624" r="16" fill="#161b22" stroke="#d2a8ff" stroke-width="5" />
    <circle cx="300" cy="624" r="7" fill="#bc8cff" />
  </g>

  <!-- Cyan Inner Nodes -->
  <g>
    <circle cx="360" cy="440" r="14" fill="#161b22" stroke="#79c0ff" stroke-width="4" />
    <circle cx="360" cy="440" r="6" fill="#58a6ff" />
    <circle cx="360" cy="584" r="14" fill="#161b22" stroke="#79c0ff" stroke-width="4" />
    <circle cx="360" cy="584" r="6" fill="#58a6ff" />
  </g>

  <!-- Emerald Deliverable Nodes (With Inner Core Pulse) -->
  <g>
    <circle cx="724" cy="400" r="16" fill="#161b22" stroke="#7ee787" stroke-width="5" />
    <circle cx="724" cy="400" r="7" fill="#3fb950" />
    <circle cx="724" cy="512" r="20" fill="#161b22" stroke="#7ee787" stroke-width="5" />
    <circle cx="724" cy="512" r="9" fill="#aff5b4" />
    <circle cx="724" cy="624" r="16" fill="#161b22" stroke="#7ee787" stroke-width="5" />
    <circle cx="724" cy="624" r="7" fill="#3fb950" />
  </g>

  <!-- Amber Synthesis Nodes -->
  <g>
    <circle cx="664" cy="440" r="14" fill="#161b22" stroke="#ffa657" stroke-width="4" />
    <circle cx="664" cy="440" r="6" fill="#f0883e" />
    <circle cx="664" cy="584" r="14" fill="#161b22" stroke="#ffa657" stroke-width="4" />
    <circle cx="664" cy="584" r="6" fill="#f0883e" />
  </g>

  <!-- Central Nexus Conductor Core (Synthesis Gateway) -->
  <g>
    <circle cx="512" cy="512" r="26" fill="#1c2128" stroke="#ffffff" stroke-width="5" />
    <circle cx="512" cy="512" r="14" fill="url(#lanePurple)" />
    <circle cx="512" cy="512" r="6" fill="#ffffff" />
  </g>

  <!-- Bottom Terminal Merge Node -->
  <g>
    <circle cx="512" cy="768" r="24" fill="#161b22" stroke="#7ee787" stroke-width="6" />
    <circle cx="512" cy="768" r="12" fill="#3fb950" />
    <circle cx="512" cy="768" r="5" fill="#ffffff" />
  </g>

  <!-- 7. Micro-Telemetry Data Markings & Typography Detail -->
  <g fill="rgba(255,255,255,0.45)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="600">
    <text x="512" y="196" font-size="14" letter-spacing="4" text-anchor="middle">ORCHESTRATOR CORE // V0.39</text>
    <text x="512" y="836" font-size="13" letter-spacing="3" text-anchor="middle">ISOLATED GIT WORKTREES · PARALLEL DAG</text>
    <text x="210" y="516" font-size="11" letter-spacing="2" text-anchor="middle" transform="rotate(-90 210 516)">STAGE 01 // INPUT</text>
    <text x="814" y="516" font-size="11" letter-spacing="2" text-anchor="middle" transform="rotate(90 814 516)">STAGE 03 // VERIFIED</text>
  </g>
</svg>
