<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dark Neutral Charcoal Gradients (Zero Blue) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#28282d" />
      <stop offset="65%" stop-color="#161618" />
      <stop offset="100%" stop-color="#0e0e10" />
    </radialGradient>

    <!-- Titanium Outer Bevel -->
    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a5a64" />
      <stop offset="25%" stop-color="#2e2e34" />
      <stop offset="50%" stop-color="#18181c" />
      <stop offset="75%" stop-color="#34343e" />
      <stop offset="100%" stop-color="#50505a" />
    </linearGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="lanePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2a8ff" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>

    <linearGradient id="laneCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>

    <linearGradient id="laneGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ee787" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <linearGradient id="laneAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa657" />
      <stop offset="100%" stop-color="#bd561d" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)" />
  <rect width="1020" height="1020" x="2" y="2" rx="222" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- 2. Micro Grid & Tech Crosshairs -->
  <g opacity="0.14" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="512" x2="864" y2="512" stroke-dasharray="4 8" />
    <line x1="512" y1="160" x2="512" y2="864" stroke-dasharray="4 8" />
    <circle cx="512" cy="512" r="380" fill="none" stroke-dasharray="2 12" />
    <circle cx="512" cy="512" r="440" fill="none" stroke-dasharray="1 16" />
    <path d="M 512 110 L 512 130 M 512 894 L 512 914 M 110 512 L 130 512 M 894 512 L 914 512" stroke-width="2" />
    <path d="M 228 228 L 244 244 M 796 228 L 780 244 M 228 796 L 244 780 M 796 796 L 780 780" stroke-width="2" />
  </g>

  <!-- 3. Outer Titanium Precision Ring with Calibrated Ticks -->
  <g filter="url(#subtleShadow)">
    <circle cx="512" cy="512" r="330" fill="#17171a" stroke="url(#metalBevel)" stroke-width="12" />
    <circle cx="512" cy="512" r="322" fill="none" stroke="rgba(0,0,0,0.8)" stroke-width="3" />
    <circle cx="512" cy="512" r="236" fill="#111113" stroke="rgba(255,255,255,0.05)" stroke-width="4" />
  </g>

