    <line x1="780.2" y1="331.0" x2="791.0" y2="322.7" />
    <line x1="802.3" y1="373.4" x2="813.4" y2="366.1" />
    <line x1="815.4" y1="419.2" x2="826.7" y2="412.9" />
  </g>

  <!-- 5. Interconnected Multi-Agent Git Pipeline Tracks (The Monogram 'O' & Symphony Nexus) -->
  <g filter="url(#neonGlow)">
    <!-- Ambient Underglow Tracks -->
    <path d="M 512 256 C 360 256 256 360 256 512 C 256 664 360 768 512 768 C 664 768 768 664 768 512 C 768 360 664 256 512 256 Z" fill="none" stroke="#21262d" stroke-width="30" stroke-linecap="round" />

    <!-- Lane 0: Main Trunk (Top & Bottom Center Highway) -->
    <path d="M 512 240 L 512 360 C 512 400 480 430 440 450 L 380 480 C 340 500 340 540 380 560 L 440 590 C 480 610 512 640 512 680 L 512 784" fill="none" stroke="#8b949e" stroke-width="8" stroke-linecap="round" />

    <!-- Lane 1: Orchid Agent Branch (Left Divergence & Loop) -->
    <path d="M 512 256 C 380 256 300 336 300 460 L 300 564 C 300 688 380 768 512 768" fill="none" stroke="url(#lanePurple)" stroke-width="12" stroke-linecap="round" />

    <!-- Lane 2: Cyan High-Speed Branch (Inner Left Ribbon) -->
    <path d="M 512 320 C 410 320 360 380 360 480 L 360 544 C 360 644 410 704 512 704" fill="none" stroke="url(#laneCyan)" stroke-width="10" stroke-linecap="round" />

    <!-- Lane 3: Emerald Verified Deliverable Branch (Right Outer Parallel Highway) -->
    <path d="M 512 256 C 644 256 724 336 724 460 L 724 564 C 724 688 644 768 512 768" fill="none" stroke="url(#laneGreen)" stroke-width="12" stroke-linecap="round" />

    <!-- Lane 4: Amber Cross-Connecting Synthesis Branch (Inner Right) -->
    <path d="M 512 320 C 614 320 664 380 664 480 L 664 544 C 664 644 614 704 512 704" fill="none" stroke="url(#laneAmber)" stroke-width="10" stroke-linecap="round" />

    <!-- Central S-Curve Conductor Baton Linkage -->
    <path d="M 360 480 C 420 480 450 512 512 512 C 574 512 604 544 664 544" fill="none" stroke="#e6edf3" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" />
    <path d="M 360 544 C 420 544 450 512 512 512 C 574 512 604 480 664 480" fill="none" stroke="#e6edf3" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" />
  </g>

  <!-- 6. Precision Micro-Commit Nodes with Concentric Rings -->
  <!-- Top Origin Fork Node (Main Origin) -->
  <g>
    <circle cx="512" cy="256" r="22" fill="#161b22" stroke="#e6edf3" stroke-width="6" />
    <circle cx="512" cy="256" r="10" fill="#79c0ff" />
    <circle cx="512" cy="256" r="4" fill="#ffffff" />
